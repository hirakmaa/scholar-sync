name: Update Google Scholar stats

on:
  schedule:
    # Runs every 6 hours (00:15, 06:15, 12:15, 18:15 UTC)
    - cron: "15 */6 * * *"
  workflow_dispatch:        # so you can also trigger it manually from the Actions tab

permissions:
  contents: write           # allow the bot to commit scholar-stats.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: Run scraper
        run: python update_scholar.py

      - name: Commit updated stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-stats.json
          if git diff --staged --quiet; then
            echo "No changes to scholar-stats.json — skipping commit."
          else
            git commit -m "chore: refresh Scholar stats $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
